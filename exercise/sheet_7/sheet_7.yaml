world:
  height: 50  # the height of the world
  width: 50   # the width of the world
  step_time: 0.1  # 10Hz calculate each step
  sample_time: 0.1  # 10 Hz for render and data extraction 
  offset: [0, 0] # the offset of the world on x and y 
  collision_mode: 'unobstructed'  # 'stop', 'unobstructed',  
  control_mode: 'keyboard'  # 'keyboard', 'auto'

robot:
  - kinematics: {name: 'acker'}  # omni, diff, acker
    shape: {name: 'rectangle', length: 4.4, width: 2.0, wheelbase: 3}
    state: [5, 5, 0, 0]
    vel_max: [4, 0.7]

    sensors:
      - name: 'lidar2d'
        range_min: 0
        range_max: 50
        angle_range: 6.28 #  4.7123
        number: 4
        noise: True
        std: 0.2
        angle_std: 0.0
        offset: [2, 0, 0]
        alpha: 0.5

obstacle:
  - shape: {name: 'linestring', vertices: [[0,0], [25, 1], [50, 2]] }  # vertices
    state: [0, 0, 0]
    color: "blue"
  - shape: {name: 'linestring', vertices: [[0,0], [1,25], [2, 50]] }  # vertices
    state: [0, 0, 0]
    color: "red"
  - shape: {name: 'linestring', vertices: [[0,50], [25,49], [50, 48]] }  # vertices
    state: [0, 0, 0]
    color: "green"
  - shape: {name: 'linestring', vertices: [[48,0], [49,25], [50, 50]] }  # vertices
    state: [0, 0, 0]
    color: "purple"

gui:
  keyboard:
    key_lv_max: 3.0
    key_ang_max: 0.7
    backend: 'mpl'